[package]
name = "dither-slint"
version = "0.1.0"
edition = "2024"
description = "Dithered Slint component library"
license = "MIT"
repository = "https://github.com/LilaccFlowerr/dither-slint"
keywords = ["slint", "ui", "dither", "components", "gui"]
categories = ["gui"]
include = ["src/**", "ui/**", "Cargo.toml", "README.md", "LICENSE"]

[dependencies]
base64 = "0.23.1"
slint = { version = "1.18.1", default-features = false, features = ["std", "compat-1-18"] }
